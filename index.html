<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEUROSCAN — Smart Contract Brain Scanner</title>
  <meta name="description" content="Visualize smart contract vulnerabilities as a neural network. Scan any EVM contract instantly.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230a0e1a' stroke='%2300ff88' stroke-width='1.5'/><circle cx='16' cy='16' r='6' fill='none' stroke='%2300ff88' stroke-width='1'/><circle cx='16' cy='16' r='2' fill='%2300ff88'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- PARTICLE CANVAS -->
  <canvas id="particles"></canvas>

  <!-- SCAN LINE EFFECT -->
  <div id="scanLine" class="scan-line hidden"></div>

  <!-- HEADER -->
  <header id="appHeader">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <circle cx="20" cy="20" r="18" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6"/>
          <circle cx="20" cy="20" r="12" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.4"/>
          <circle cx="20" cy="20" r="6" fill="none" stroke="#00ff88" stroke-width="1.5"/>
          <circle cx="20" cy="20" r="2.5" fill="#00ff88"/>
          <!-- Neural connections -->
          <line x1="20" y1="2" x2="20" y2="8" stroke="#00ff88" stroke-width="0.5" opacity="0.5"/>
          <line x1="20" y1="32" x2="20" y2="38" stroke="#00ff88" stroke-width="0.5" opacity="0.5"/>
          <line x1="2" y1="20" x2="8" y2="20" stroke="#00ff88" stroke-width="0.5" opacity="0.5"/>
          <line x1="32" y1="20" x2="38" y2="20" stroke="#00ff88" stroke-width="0.5" opacity="0.5"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>NEUROSCAN</h1>
        <span class="logo-sub">Smart Contract Brain Scanner</span>
      </div>
    </div>
    <div class="header-links">
      <a href="https://github.com/eawhitehat/neuroscan" target="_blank" class="gh-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="landing">
    <!-- INPUT PANEL -->
    <div id="inputPanel" class="glass-panel input-panel">
      <h2>🧠 Neural Scan</h2>
      <p class="input-desc">Paste a contract address to visualize its security architecture</p>
      <div class="input-group">
        <input type="text" id="contractAddress" placeholder="0x..." spellcheck="false" autocomplete="off">
        <select id="chainSelect">
          <option value="bsc" selected>BSC</option>
          <option value="eth">ETH</option>
          <option value="arb">ARB</option>
          <option value="base">BASE</option>
          <option value="poly">POLY</option>
        </select>
      </div>
      <div class="apikey-toggle">
        <button type="button" id="apikeyToggle" class="apikey-toggle-btn">🔑 API Key <span class="apikey-tag">optional</span></button>
      </div>
      <div id="apikeyGroup" class="apikey-group hidden">
        <input type="text" id="apiKeyInput" placeholder="Etherscan/BscScan API Key (free tier)" spellcheck="false" autocomplete="off">
        <p class="apikey-hint">Free key = faster scans & no rate limits. <a href="https://etherscan.io/apis" target="_blank">Get one →</a></p>
      </div>
      <div class="input-actions">
        <button id="scanBtn" class="btn-scan">
          <span class="btn-text">⚡ Initialize Scan</span>
          <span class="btn-loading hidden">Scanning...</span>
        </button>
        <button id="demoBtn" class="btn-demo">Demo</button>
      </div>
      <div id="scanStatus" class="scan-status hidden"></div>
    </div>

    <!-- NEURAL GRAPH CONTAINER -->
    <div id="graphContainer" class="graph-container hidden">
      <svg id="neuralGraph"></svg>
      <div id="nodeTooltip" class="node-tooltip hidden"></div>
    </div>

    <!-- RISK GAUGE -->
    <div id="riskPanel" class="glass-panel risk-panel hidden">
      <h3>Risk Score</h3>
      <div class="gauge-container">
        <svg viewBox="0 0 200 200" class="gauge-svg">
          <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="12"/>
          <circle id="gaugeArc" cx="100" cy="100" r="85" fill="none" stroke="#00ff88" stroke-width="12"
            stroke-dasharray="534" stroke-dashoffset="534" stroke-linecap="round"
            transform="rotate(-90 100 100)" class="gauge-arc"/>
        </svg>
        <div class="gauge-value">
          <span id="riskScore">0</span>
          <span class="gauge-label">/ 100</span>
        </div>
      </div>
      <div id="riskLevel" class="risk-level">—</div>
      <div id="riskStats" class="risk-stats"></div>
    </div>

    <!-- FINDINGS PANEL -->
    <div id="findingsPanel" class="glass-panel findings-panel hidden">
      <h3>🔍 Findings <span id="findingsCount" class="findings-count">0</span></h3>
      <div id="findingsList" class="findings-list"></div>
    </div>

    <!-- FUNCTION DETAIL PANEL -->
    <div id="detailPanel" class="glass-panel detail-panel hidden">
      <div class="detail-header">
        <h3 id="detailTitle">Function Details</h3>
        <button id="detailClose" class="detail-close">✕</button>
      </div>
      <div id="detailContent" class="detail-content"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <span>Built by <a href="https://github.com/eawhitehat" target="_blank">@eawhitehat</a></span>
    <span class="footer-sep">·</span>
    <span>Open Source</span>
  </footer>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="engine.js"></script>
  <script src="graph.js"></script>
  <script src="app.js"></script>
</body>
</html>
